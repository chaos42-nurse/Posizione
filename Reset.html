<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Posizione</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif;text-align:center}
#text{font-size:20px;max-width:500px;min-height:60px;padding:20px}
#text::after{content:"|";animation:blink 1s infinite}
@keyframes blink{0%,50%,100%{opacity:1}25%,75%{opacity:0}}
</style>
</head>
<body><p id="text"></p>
<script>
const KEY="savedLocation",text=document.getElementById("text");
function typing(s,done){let i=0;text.textContent="";function w(){if(i<s.length){text.textContent+=s[i++];setTimeout(w,40)}else setTimeout(done,800)}w()}
typing("Sei in macchina",()=>localStorage.removeItem(KEY));
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
