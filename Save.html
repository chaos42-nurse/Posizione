<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Posizione</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#fff;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
#text{font-size:20px;max-width:500px;min-height:60px;padding:20px}
#text::after{content:"|";animation:blink 1s infinite}
@keyframes blink{0%,50%,100%{opacity:1}25%,75%{opacity:0}}
#loader{margin-top:30px;width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top:3px solid white;border-radius:50%;animation:spin 1s linear infinite;opacity:0;transition:.3s}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-out{opacity:0;transition:.8s}
</style>
</head>
<body>
<p id="text"></p><div id="loader"></div>
<script>
const KEY="savedLocation",text=document.getElementById("text"),loader=document.getElementById("loader");
function typing(s,done){let i=0;text.textContent="";function w(){if(i<s.length){text.textContent+=s[i++];setTimeout(w,40)}else setTimeout(done,600)}w()}
function saved(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x.lat==="number"&&typeof x.lng==="number"?x:null}catch(e){return null}}
function maps(x){const url="https://www.google.com/maps?q="+encodeURIComponent(x.lat+","+x.lng);loader.style.opacity="1";setTimeout(()=>{document.body.classList.add("fade-out");setTimeout(()=>location.href=url,800)},1200)}
function start(){const x=saved();if(x){typing("Ti porto in macchina",()=>maps(x));return}typing("Posizione salvata",()=>{if(!navigator.geolocation){text.textContent="Geolocalizzazione non disponibile";return}navigator.geolocation.getCurrentPosition(p=>{const x={lat:p.coords.latitude,lng:p.coords.longitude};localStorage.setItem(KEY,JSON.stringify(x));maps(x)},()=>{text.textContent="Non riesco a rilevare la posizione"}, {enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
start();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
