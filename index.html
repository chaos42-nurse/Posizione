<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Salva e ritrova rapidamente la posizione della tua auto.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Posizione</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

main{
  width:min(92%,420px);
  padding:28px 20px;
}

h1{
  margin:0 0 10px;
  font-size:28px;
  font-weight:500;
}

#status{
  min-height:48px;
  margin:0 0 28px;
  font-size:17px;
  line-height:1.45;
  opacity:.85;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
}

button{
  width:100%;
  min-height:58px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:16px;
  background:#171717;
  color:#fff;
  font-size:17px;
  cursor:pointer;
  transition:.2s;
}

button:active{
  transform:scale(.98);
  background:#222;
}

button:disabled{
  opacity:.45;
  cursor:default;
}

.secondary{
  background:transparent;
}

#loader{
  width:38px;
  height:38px;
  margin:24px auto 0;
  border:3px solid rgba(255,255,255,.18);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hidden{display:none!important}
</style>
</head>

<body>
<main>
  <h1>Posizione</h1>
  <p id="status">Controllo la posizione salvata…</p>

  <div class="buttons">
    <button id="mainButton">Carica posizione</button>
    <button id="resetButton" class="secondary">Azzera posizione</button>
  </div>

  <div id="loader"></div>
</main>

<script>
const STORAGE_KEY = "savedLocation";

const status = document.getElementById("status");
const mainButton = document.getElementById("mainButton");
const resetButton = document.getElementById("resetButton");
const loader = document.getElementById("loader");

function getSavedLocation(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(!saved) return null;

    const location = JSON.parse(saved);

    if(
      typeof location.lat !== "number" ||
      typeof location.lng !== "number"
    ){
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }

    return location;
  }catch{
    localStorage.removeItem(STORAGE_KEY);
    return null;
  }
}

function updateInterface(){
  const saved = getSavedLocation();

  if(saved){
    status.textContent = "Hai una posizione dell'auto salvata.";
    mainButton.textContent = "Portami in macchina";
  }else{
    status.textContent = "Nessuna posizione salvata.";
    mainButton.textContent = "Salva posizione";
  }
}

function setLoading(value){
  mainButton.disabled = value;
  resetButton.disabled = value;
  loader.style.display = value ? "block" : "none";
}

function openMaps(location){
  const url =
    "https://www.google.com/maps?q=" +
    encodeURIComponent(location.lat + "," + location.lng);

  window.location.href = url;
}

function saveCurrentPosition(){
  if(!navigator.geolocation){
    status.textContent = "La geolocalizzazione non è disponibile su questo dispositivo.";
    return;
  }

  setLoading(true);
  status.textContent = "Rilevo la posizione…";

  navigator.geolocation.getCurrentPosition(
    position=>{
      const location = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(location));

      status.textContent = "Posizione salvata.";
      setLoading(false);
      updateInterface();
    },
    error=>{
      setLoading(false);

      if(error.code === error.PERMISSION_DENIED){
        status.textContent = "Permesso di posizione negato. Abilitalo nelle impostazioni del browser.";
      }else if(error.code === error.POSITION_UNAVAILABLE){
        status.textContent = "Posizione non disponibile. Riprova.";
      }else if(error.code === error.TIMEOUT){
        status.textContent = "Rilevamento scaduto. Riprova.";
      }else{
        status.textContent = "Non riesco a rilevare la posizione. Riprova.";
      }
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

function mainAction(){
  const saved = getSavedLocation();

  if(saved){
    openMaps(saved);
  }else{
    saveCurrentPosition();
  }
}

function resetLocation(){
  localStorage.removeItem(STORAGE_KEY);
  status.textContent = "Posizione cancellata.";
  updateInterface();
}

mainButton.addEventListener("click", mainAction);
resetButton.addEventListener("click", resetLocation);

updateInterface();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
